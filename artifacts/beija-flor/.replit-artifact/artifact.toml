kind = "mobile"
previewPath = "/"
title = "Grupo Beija-flor"
version = "1.0.0"
id = "artifacts/beija-flor"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
localPort = 18199
name = "expo"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/beija-flor run dev"

[services.env]
PORT = "18199"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/beija-flor", "run", "build"]
run = ["pnpm", "--filter", "@workspace/beija-flor", "run", "serve"]
